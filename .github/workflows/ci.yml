# file: .github/workflows/ci.yml
# description: Landing site CI, typecheck and production build
# reference: package.json, README.md
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Content guard
        run: bun run check:content
      - name: Link verification
        run: bun run verify:links
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
