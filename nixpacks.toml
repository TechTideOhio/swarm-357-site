[phases.setup]
nixPkgs = ["nodejs_20", "unzip"]

[phases.install]
cmds = ["curl -fsSL https://bun.sh/install | bash", "export PATH=$HOME/.bun/bin:$PATH && bun install --frozen-lockfile"]

[phases.build]
cmds = ["export PATH=$HOME/.bun/bin:$PATH && bun run build"]

[start]
cmd = "export PATH=$HOME/.bun/bin:$PATH && bun run start -- -p ${PORT:-3000}"

[variables]
NIXPACKS_NODE_VERSION = "20"
